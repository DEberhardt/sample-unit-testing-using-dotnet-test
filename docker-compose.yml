version: "3.8"

services:
  pipeline-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet-pipeline-test
    volumes:
      # Mount local directory for live artifact access
      - .:/app
    environment:
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
